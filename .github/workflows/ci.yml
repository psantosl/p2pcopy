name: ci

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --logger "trx" --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  aot-smoke:
    name: native aot (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Publish
        run: dotnet publish src/p2pcopy/p2pcopy.csproj -c Release -r linux-x64 -o artifacts/linux-x64

      - name: Smoke test
        run: |
          ls -la artifacts/linux-x64
          artifacts/linux-x64/p2pcopy --version
          artifacts/linux-x64/p2pcopy --help

      - uses: actions/upload-artifact@v4
        with:
          name: p2pcopy-linux-x64-ci-${{ github.run_number }}
          path: artifacts/linux-x64/p2pcopy
